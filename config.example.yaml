# ---------------- 别名: harness 请求里的 model 字段 ----------------
aliases:
  auto: auto              # 按难度自动路由 (默认)
  cheap: trivial          # 锁定简单档
  fast: trivial
  smart: hard             # 锁定困难档
  reasoning: hard
  default: standard       # 锁定标准档

stats:
  db_path: router_stats.db
